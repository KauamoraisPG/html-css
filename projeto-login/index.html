<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/othersdisplays.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
</head>
<body>
    <main>
        <section class="login">
            <div class="foto"></div>
            <div class="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente! Faça login para acessar sua conta e poder fazer as configurações ambienteção.</p>
                <form action="#" autocomplete="no" method="post" class="inputs">
                    <label for="ilogin"><span class="material-symbols-outlined">person</span></label>
                    <input type="email" name="login" id="ilogin" class="inlogin" required placeholder="E-mail" autocomplete="email">
                    <br>
                    <label for="ipass"><span class="material-symbols-outlined">vpn_key</span></label>
                    <input type="password" name="pass" id="ipass" class="senha" required minlength="8" placeholder="Senha" autocomplete="current-password">
                    <br>
                    <input type="submit" value="Entrar" class="entrar">
                    <a href="#" class="repass">Esqueci a senha</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>

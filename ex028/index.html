<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>  
    <form action="#" method="post">
        <p>
            <label for="in1">Número 1: </label>
            <input type="number" name="n1" id="in1" oninput="ism.innerHTML = Number(in1.value) * Number(in2.value)" required>
        </p>
        <p>
            <label for="in2">Número 2: </label>
            <input type="number" name="n1" id="in2" oninput="ism.innerHTML = Number(in1.value) * Number(in2.value)" required>
        </p>
        <p>
            <label for="ism">Soma: </label>
            <output name="sm" id="ism">0</output>
        </p>
        <p>
            <label for="istf">Satisfação</label>
            <input type="range" name="stf" id="istf" min="1" max="5" value="3" oninput="val.innerHTML = Number(istf.value)">
            <output id="val">3</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

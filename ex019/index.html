<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: rgb(41, 41, 41);
            font-family: Arial, Helvetica, sans-serif;
            color: rgb(233, 233, 233);
        }

        h1 {
            width: 300px;
            height: 300px;
            margin: 2px;
            padding: 5px;
            background-color: rgb(116, 116, 116);
            border-style: solid;
            border-width: 6px 2px 2px 2px;
            border-color: rgb(0, 4, 255);
            border-top-style: dashed;
            border-top-color: rgb(255, 230, 0);

            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;

            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            margin-right: 10px;

            outline-width: 7px;
            outline-color: white;
            outline-style: solid;
        }

        a {
            color: wheat;
            border-width: 1px;
            border-style: solid;
            border-color: lightgreen;
            padding: 4px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Paragrafo tambem sao exemplos de box-levels, mas os <a href="youtube.com">links sao exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona.</p>
</body>
</html>

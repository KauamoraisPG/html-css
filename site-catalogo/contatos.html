<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Espelhos</title>
    <link rel="stylesheet" href="estilo-contatos/style.css">
    <link rel="stylesheet" href="estilo-contatos/media-queries.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header>
        <div>
            <a href="index.html" class="logo"><h1>MKes</h1></a>
        </div>
        <div class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contatos.html">Contatos</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h1>Contatos</h1>
        <section class="contatos">
            <a href="#">
                <div class="container-titulo"><p>Instagram</p>
            </a>
            <span class="material-symbols-outlined">alternate_email</span></div>
            <div class="instagram">
                <div class="foto-instagram"></div>
            </div>
            <a href="#">
                <div class="container-titulo"><p>Whatsapp</p>
            </a>
            <span class="material-symbols-outlined">call</span></div>
            <div class="whatsapp">
                <div class="foto-whatsapp"></div>
            </div>
            <a href="#">
                <div class="container-titulo"><p>Email</p>
            </a>
            <span class="material-symbols-outlined">mail</span></div>
            <div class="email">
                <div class="foto-email"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="rodape">
            <div class="horario">
                <h2>Horarios</h2>
                <p>segunda/sexta: 08:00 as 17:00</p>
                <p>sabado: 10:00 as 17:00</p>
                <p>domingo: 10:00 as 13:00</p>
            </div>
            <div class="contato-rodape">
                <h2>Contatos</h2>
                <p><a href="#">Instagram</a><span class="material-symbols-outlined">alternate_email</span></p>
                <p><a href="#">Whatsapp</a><span class="material-symbols-outlined">call</span></p>
                <p><a href="#">Email</a><span class="material-symbols-outlined">mail</span></p>
            </div>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/othersdisplays.css">
    
</head>
<body>
    <main>
        <section class="login">
            <div>
                <img src="imagens/espelho.jpe" alt="">
            </div>
            <div>
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente! Faça login para acessar sua conta e poder fazer as configurações ambienteç.</p>
                <form action="#" autocomplete="no" method="post">
                    <label for="ilogin">Email:</label>
                    <input type="" name="login" id="ilogin" class="login">
                    <br>
                    <label for="ipass">Senha:</label>
                    <input type="password" name="pass" id="ipass" class="senha">
                    <br>
                    <input type="submit" value="Entrar" class="entrar">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
